<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Profil — TutorHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">Tutorio</a>
    <nav>
      <a href="/index.html">Startseite</a>
      <a href="/requests.html">Hilfsgesuche</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main class="page" style="max-width:560px;">
    <h1>Mein Profil</h1>

    <div class="tutor-card">
      <form id="profile-form">
        <label for="description">Über mich</label>
        <textarea id="description" rows="4"></textarea>

        <label for="availability">Verfügbarkeit</label>
        <input type="text" id="availability" placeholder="z. B. Mo-Fr ab 16 Uhr">

        <label for="price-model">Preismodell</label>
        <input type="text" id="price-model" placeholder="z. B. kostenlos oder 10 € pro Stunde">
        
        <fieldset style="border:none; padding:0; margin:0 0 16px;">
          <legend style="font-weight:600; font-size:0.9rem; margin-bottom:8px;">Fächer, die ich unterrichte</legend>
          <div id="subject-checkboxes">Lade Fächer…</div>
        </fieldset>

        <button type="submit" class="btn btn-primary" style="width:100%;">Speichern</button>
        <p id="form-message" class="form-message"></p>
      </form>
    </div>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/profile-edit.js"></script>
</body>
</html>
