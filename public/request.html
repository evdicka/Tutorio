<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hilfsgesuch — TutorHub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">Tutorio</a>
    <nav>
      <a href="/index.html">Startseite</a>
      <a href="/requests.html">Hilfsgesuche</a>
      <span id="nav-auth"></span>
    </nav>
  </header>

  <main class="page" style="max-width:680px;">
    <div id="request-detail" class="tutor-card">Lade Gesuch…</div>

    <h3>Antworten</h3>
    <div id="replies"></div>

    <div class="tutor-card">
      <form id="reply-form">
        <label for="reply-content">Deine Antwort</label>
        <textarea id="reply-content" rows="3" required></textarea>
        <button type="submit" class="btn btn-primary">Antworten</button>
        <p id="reply-error" class="form-message error"></p>
      </form>
    </div>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/request-detail.js"></script>
</body>
</html>
