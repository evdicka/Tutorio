<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden — Tutorio</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="navbar">
    <a href="/index.html" class="brand">Tutorio</a>
    <nav>
      <a href="/index.html">Startseite</a>
      <a href="/requests.html">Hilfsgesuche</a>
    </nav>
  </header>

  <main class="page" style="max-width:420px;">
    <div style="text-align:center; margin-bottom:24px;">
      <h1>Tutorio</h1>
      <p>Tritt unserer Peer-to-Peer-Lerngemeinschaft bei</p>
    </div>

    <div class="tutor-card">
      <h2>Willkommen zurück</h2>
      <p>Melde dich an, um weiter zu lernen</p>

      <form id="login-form">
        <label for="username">Benutzername</label>
        <input type="text" id="username" placeholder="musterm" required>

        <label for="password">Passwort</label>
        <input type="password" id="password" required>

        <button type="submit" class="btn btn-primary" style="width:100%;">Anmelden</button>
        <p id="login-error" class="form-message error"></p>
      </form>
    </div>

    <p style="text-align:center; margin-top:16px;">Digikabu-Zugangsdaten verwenden</p>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
